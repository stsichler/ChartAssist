# Pakete für alle Plattformen (docs/TECHNISCHE-BASIS.md, 8 und 9).
# - Tag v<vierstellige Version>: Release-Entwurf mit den Paketen, von Hand zu veröffentlichen,
#   nachdem die Release-Notes geprüft sind.
# - Von Hand gestartet (Actions → "Run workflow", Branch wählbar): nur Testpakete als Download am
#   Lauf, kein Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version der Testpakete, vierstellig (leer: aus Directory.Build.props)'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    working-directory: ChartAssist
    shell: bash

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   asset: ChartAssist-win-x64.zip }
          - { os: ubuntu-latest,  rid: linux-x64, asset: ChartAssist-linux-x64.tar.gz }
          - { os: macos-latest,   rid: osx-arm64, asset: ChartAssist-macos-arm64.zip }
          - { os: macos-latest,   rid: osx-x64,   asset: ChartAssist-macos-x64.zip }
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION:-$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Die Version muss vierstellig sein, z. B. 1.0.0.0 (Tag: v1.0.0.0), ist aber: $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Testen
        run: dotnet test -c Release

      # Windows und Linux: eine einzige ausführbare Datei
      - name: Veröffentlichen (Single-File)
        if: runner.os != 'macOS'
        run: >
          dotnet publish src/ChartAssist -c Release -r "$RID" --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version="$VERSION" -o "publish/$RID"

      # macOS: normales Publish in ein .app-Bundle. Kein Single-File, damit die nativen
      # Bibliotheken signiert im Bundle liegen und nicht zur Laufzeit entpackt werden.
      - name: Veröffentlichen (.app-Bundle)
        if: runner.os == 'macOS'
        run: |
          dotnet publish src/ChartAssist -c Release -r "$RID" --self-contained true \
            -p:DebugType=none -p:Version="$VERSION" -o "publish/$RID"

          app="publish/ChartAssist.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R "publish/$RID/." "$app/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"

          iconset="publish/ChartAssist.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z $size $size src/ChartAssist/Assets/Icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            if [ $double -le 256 ]; then
              sips -z $double $double src/ChartAssist/Assets/Icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/ChartAssist.icns"

          # Ad-hoc-Signatur, auf Apple Silicon Pflicht (TECHNISCHE-BASIS 6)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Archiv erstellen
        run: |
          case "$RUNNER_OS" in
            Windows) pwsh -NoProfile -Command "Compress-Archive -Path 'publish/$RID/ChartAssist.exe' -DestinationPath '$ASSET'" ;;
            Linux)   tar -czf "$ASSET" -C "publish/$RID" ChartAssist ;;
            macOS)   ditto -c -k --keepParent publish/ChartAssist.app "$ASSET" ;;
          esac
          size=$(wc -c < "$ASSET")
          echo "| $ASSET | $((size / 1024 / 1024)) MB |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ChartAssist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: publish
    # Nur bei einem Tag; von Hand gestartete Läufe liefern nur Testpakete
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Downloads:** Windows 10/11 (`win-x64`), Linux (`linux-x64`), macOS Apple Silicon (`macos-arm64`) und Intel (`macos-x64`). Eine .NET-Installation ist nicht nötig.

          **Tipp:** Die Seiten der DFS im Browser als „Webseite, komplett“ speichern, dann führen die Karteneinträge direkt zur Karte.

          **macOS:** Die App ist nicht von Apple notarisiert. Beim ersten Start mit Rechtsklick → Öffnen starten oder im Terminal `xattr -dr com.apple.quarantine ChartAssist.app` ausführen.

          ChartAssist wird mit Unterstützung von KI entwickelt (Claude Code von Anthropic). Einzelheiten stehen in der LICENSE.
          EOF
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ChartAssist ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --draft
